<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}{% feed_meta %}
{% if page.robots %}<meta name="robots" content="{{ page.robots | escape }}">{% endif %}
<link rel="icon" type="image/png" href="{{ '/assets/img/about-snake.png' | relative_url }}?v=2">
<link rel="stylesheet" href="{{ '/assets/css/satellite.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/satellite-custom.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="{{ '/assets/css/terminal.css' | relative_url }}?v={{ site.time | date: '%s' }}">
{% if page.layout == 'post' %}<link rel="stylesheet" href="{{ '/assets/css/article.css' | relative_url }}?v={{ site.time | date: '%s' }}">{% endif %}
<script defer src="{{ '/assets/js/satellite.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</head>
<body{% if page.layout == 'post' %} class="article-page"{% endif %}>
<script>try { if ((localStorage.getItem('satellite-theme') || '{{ site.theme_mode }}') === 'dark') document.body.classList.add('dark-theme'); } catch (e) { document.body.classList.add('dark-theme'); }</script>
<a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
<header class="terminal-header">
<a class="terminal-brand" href="{{ '/' | relative_url }}">ssnake@blog:~#</a>
<div class="terminal-controls"><a href="{{ '/about/' | relative_url }}">소개</a><button type="button" id="theme-switch" class="theme-toggle" aria-label="색상 테마 전환">◐</button><button type="button" id="menu-toggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="navigation">☰ 메뉴</button></div>
<nav id="navigation" aria-label="주 메뉴"><a href="{{ '/' | relative_url }}">Home</a>{% for category in site.data.knights_categories %}<a href="{{ '/notes/' | append: category.slug | append: '/' | relative_url }}"{% if page.category_name == category.name %} aria-current="page"{% endif %}>{{ category.name }}</a>{% endfor %}<a href="{{ '/about/' | relative_url }}">소개</a><a href="{{ '/archives/' | relative_url }}">아카이브</a><a href="{{ '/tags/' | relative_url }}">태그</a></nav>
</header>
<div id="post"><div class="inner-header" aria-hidden="true"><span class="dot" style="background:#f86158"></span><span class="dot" style="background:#fbbf2d"></span><span class="dot" style="background:#2acb45"></span></div><div class="inner-content"><main id="main-content" tabindex="-1">{{ content }}</main></div></div>
<footer class="site-footer">© {{ 'now' | date: '%Y' }} {{ site.social.name }} · <a href="https://github.com/byanko55/jekyll-theme-satellite">Satellite</a></footer>
</body></html>
