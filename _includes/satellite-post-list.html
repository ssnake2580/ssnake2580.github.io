<ul class="entry-list">{% for post in include.records %}<li><a href="{{ post.url | relative_url }}"><h3>{{ post.title | escape }}</h3><p>{{ post.excerpt | strip_html | truncate: 140 | escape }}</p><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%Y.%m.%d' }}</time><span class="entry-category">{{ post.categories | join: ' · ' | escape }}</span></a></li>{% else %}<li>아직 작성된 기록이 없습니다.</li>{% endfor %}</ul>
